<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OCTAGON CLASH — Custom Fighters</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<header class="topbar"><div class="logo">OCTAGON <span>CLASH</span></div><div class="platform">PC + MOBILE</div></header>
<section id="select" class="screen active"><div class="intro"><div class="kicker">CUSTOM FIGHTER ARENA</div><h1>ENTER THE<br><em>OCTAGON</em></h1><p>Choose two fighters from your custom roster.</p></div><div id="roster" class="roster"></div><div class="selection-status" id="selectionStatus">Choose your fighter</div><button id="fightBtn" class="primary" disabled>CHOOSE OPPONENT</button><p class="controls-note">PC: WASD / Arrow keys + J K L I O P • Mobile: on-screen controls</p></section>
<section id="fight" class="screen"><div class="hud"><div class="hud-fighter"><strong id="pName">PLAYER</strong><div class="health"><i id="pHp"></i></div><small><span id="pHpText">100</span> HP</small></div><div class="round"><b id="round">R1</b><strong id="timer">1:00</strong></div><div class="hud-fighter right"><strong id="aName">OPPONENT</strong><div class="health"><i id="aHp"></i></div><small><span id="aHpText">100</span> HP</small></div></div>
<div class="arena" id="arena"><div class="lights"></div><div class="crowd"></div><div class="cage"><span></span><span></span><span></span></div><div class="mat"></div><div class="corner-label left">HOME</div><div class="corner-label right">AWAY</div><div id="pSprite" class="sprite player"><img><div class="floor-shadow"></div></div><div id="aSprite" class="sprite enemy"><img><div class="floor-shadow"></div></div><div id="hitText" class="hit-text"></div><div id="fightMessage" class="fight-message">FIGHT!</div></div>
<div class="stamina"><div><i id="pStam"></i></div><div><i id="aStam"></i></div></div>
<div class="mobile-controls"><div class="dpad"><button data-action="left">◀</button><button data-action="forward">▲</button><button data-action="right">▶</button></div><div class="action-grid"><button data-action="jab">JAB<span>J</span></button><button data-action="cross">CROSS<span>K</span></button><button data-action="kick">KICK<span>L</span></button><button data-action="block">BLOCK<span>I</span></button><button data-action="takedown">TAKEDOWN<span>O</span></button><button data-action="heavy">HEAVY<span>P</span></button></div></div><button id="backBtn" class="back">← EXIT FIGHT</button></section>
<section id="result" class="screen result"><div class="kicker">OFFICIAL RESULT</div><h2 id="resultTitle">VICTORY</h2><div class="result-card" id="resultCard"></div><button id="rematchBtn" class="primary">REMATCH</button><button id="rosterBtn" class="secondary">CHANGE FIGHTERS</button></section>
</div><script src="game.js"></script></body></html>
